
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galaxy Background</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #000;
  }

  /* Galaxy container */
  .galaxy {
    position: fixed;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background:
      radial-gradient(circle at 30% 40%, #00ffff, transparent 40%),
      radial-gradient(circle at 70% 60%, #ff00ff, transparent 40%),
      radial-gradient(circle at 50% 50%, #ffff00, transparent 30%),
      radial-gradient(circle at 80% 20%, #00ff88, transparent 35%),
      radial-gradient(circle at 20% 80%, #ff0088, transparent 35%);
    filter: invert(1) contrast(1.4) saturate(2);
    animation: swirl 40s linear infinite;
    mix-blend-mode: screen;
  }

  /* Subtle star noise layer */
  .stars {
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-radial-gradient(
      white 0px,
      white 1px,
      transparent 2px
    );
    opacity: 0.15;
    animation: drift 60s linear infinite;
  }

  /* Animations */
  @keyframes swirl {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
  }

  @keyframes drift {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(-200px, -200px); }
  }
</style>
</head>
<body>

<div class="galaxy"></div>
<div class="stars"></div>

</body>
</html>
