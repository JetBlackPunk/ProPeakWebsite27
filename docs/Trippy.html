<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trippy Animation</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
}

canvas {
    display: block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

let t = 0;

function draw() {
    const w = canvas.width;
    const h = canvas.height;

    // Slow color-changing background
    const bgHue = (t * 5) % 360;

    const grad = ctx.createRadialGradient(
        w / 2, h / 2, 0,
        w / 2, h / 2, Math.max(w, h)
    );

    grad.addColorStop(0, `hsl(${bgHue}, 70%, 12%)`);
    grad.addColorStop(1, `hsl(${(bgHue + 120) % 360}, 60%, 4%)`);

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = "screen";

    const layers = 12;

    for (let l = 0; l < layers; l++) {
        const radius = 50 + l * 35;
        const hue = (bgHue + l * 25) % 360;

        ctx.beginPath();

        for (let a = 0; a <= Math.PI * 2.05; a += 0.03) {
            const wave =
                Math.sin(a * 4 + t + l) * 15 +
                Math.cos(a * 3 - t * 0.7 + l) * 10;

            const r = radius + wave;

            const x = w / 2 + Math.cos(a) * r;
            const y = h / 2 + Math.sin(a) * r;

            if (a === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.strokeStyle = `hsla(${hue}, 90%, 65%, 0.12)`;
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    ctx.globalCompositeOperation = "source-over";

    t += 0.01;
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
