    <style>
    /* MENU BUTTON */
    .menu-btn {
    position: fixed;
    top: 20px;
    right: 20px;

    width: 55px;
    height: 55px;

    border: none;
    border-radius: 14px;

    background: rgba(20,20,20,0.92);
    color: white;

    font-size: 28px;
    cursor: pointer;

    border: 2px solid #0072ff;

    box-shadow: 0 8px 25px rgba(0,0,0,0.25);

    transition: 0.3s ease;

    z-index: 2000;
    }

    .menu-btn:hover {
    transform: scale(1.08);
    background: #0072ff;
    }

    /* NAVBAR */
    .topbar {
    position: fixed;
    top: -120px;
    left: 0;

    width: 100%;
    height: 100px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;

    background: rgba(20,20,20,0.96);
    backdrop-filter: blur(10px);

    border-bottom: 2px solid #0072ff;

    transition: top 0.4s ease;

    z-index: 1500;
    }

    /* SHOW NAVBAR */
    .topbar.show {
    top: 0;
    }

    /* LINKS */
    .topbar a {
    position: relative;

    color: white;
    text-decoration: none;

    padding: 14px 24px;
    border-radius: 12px;

    font-family: Arial, sans-serif;
    font-weight: bold;

    transition: 0.3s ease;
    }

    /* ACTIVE PAGE */
    .topbar a.active {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    box-shadow: 0 0 12px rgba(0,114,255,0.6);
    }

    /* HOVER */
    .topbar a:hover:not(.active) {
    background: rgba(255,255,255,0.12);
    transform: translateY(-2px);
    }

    /* UNDERLINE EFFECT */
    .topbar a::after {
    content: "";
    position: absolute;

    left: 50%;
    bottom: 6px;

    width: 0%;
    height: 2px;

    background: #00c6ff;

    transition: 0.3s ease;
    transform: translateX(-50%);
    }

    .topbar a:hover::after {
    width: 70%;
    }

    /* MOBILE */
    @media screen and (max-width: 700px) {
    .topbar {
        flex-direction: column;
        height: auto;
        padding: 20px 0;
    }
    }
    </style>
